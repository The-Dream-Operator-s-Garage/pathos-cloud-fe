<!doctype html>
<!-- The clean door to the Terms of Service (2026-10-31): https://pathos.cloud/terms/
     is the URL Google's OAuth consent screen links, so it must exist without
     a #fragment. It forwards into the hash route /#/terms (LegalPage.vue),
     keeping ?lang=; the text lives in allegue's source note, read through
     GET /api/legal/terms. Without JavaScript, <noscript> offers that same
     text as plain markdown. Twin: ../privacy/index.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terms of Service · pathos.cloud</title>
  <meta name="description" content="The terms for using pathos.cloud, including Google Drive storage. Condiciones del Servicio en español: ?lang=es">
  <link rel="canonical" href="https://pathos.cloud/terms/">
  <link rel="icon" href="/favicon.ico">
  <script>location.replace('/#/terms' + location.search)</script>
</head>
<body style="margin:0;background:#0D0D1A;color:#ffe0b2;font:15px/1.6 system-ui,sans-serif">
  <noscript>
    <main style="max-width:640px;margin:48px auto;padding:0 16px">
      <h1 style="font-weight:400;letter-spacing:.08em">pathos.cloud — Terms of Service</h1>
      <p>This page needs JavaScript to render. The same text, as plain markdown:
        <a style="color:#64ffda" href="https://api.pathos.cloud/api/legal/terms?lang=en&amp;format=md">English</a> ·
        <a style="color:#64ffda" href="https://api.pathos.cloud/api/legal/terms?lang=es&amp;format=md">Español</a>
      </p>
      <p>Contact: <a style="color:#64ffda" href="mailto:allegue@pathos.cloud">allegue@pathos.cloud</a></p>
    </main>
  </noscript>
</body>
</html>
