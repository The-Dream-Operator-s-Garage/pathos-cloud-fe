name: PR check

on:
  pull_request:
    branches: [staging-main, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx quasar build
        env:
          PATHOS_API_URL: https://api.pathos.cloud
